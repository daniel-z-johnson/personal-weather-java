info:
  name: findLocations
  type: http
  seq: 1

http:
  method: GET
  url: localhost:8080/api/locations/search?city=Bentonville
  params:
    - name: city
      value: Bentonville
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
