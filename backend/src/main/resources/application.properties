spring.application.name=personal-weather

open-weather.base-url=https://api.openweathermap.org
open-weather.api-key=${OPEN_WEATHER_KEY:}

# Outbound HTTP calls (OpenWeather) give up rather than hold a request thread; a timeout becomes a 502
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=5s

# How long a search result's id can be used to pick that location
locations.search-ttl=1h

# How long a location's current weather is reused before calling OpenWeather again
weather.cache-ttl=15m

# Flyway owns the schema; Hibernate only checks its entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
