# Local development against the services in ../docker-compose.yml

spring.datasource.url=jdbc:postgresql://localhost:5432/weather
spring.datasource.username=weather
spring.datasource.password=postgress

spring.data.redis.host=localhost
spring.data.redis.port=6380

# Keep [.properties]: without it Spring can't parse .env, and optional: hides the failure,
# so the app reports a blank api key instead.
spring.config.import=optional:file:.env[.properties]
